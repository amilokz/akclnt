server {
    server_name akclnt.com www.akclnt.com;
    root /var/www/akclnt.com/public;
    index index.php index.html;

    location /myraa-api/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /myraa {
        try_files /myraa.html =404;
    }

    location = /api/website-audit {
        proxy_pass http://localhost:5678/webhook/website-audit;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/akclnt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/akclnt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.akclnt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = akclnt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name akclnt.com www.akclnt.com;
    return 404; # managed by Certbot




}